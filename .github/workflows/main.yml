name: Manual Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - development
          - staging
          - production
      deploy_tests:
        description: 'Run integration tests?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  
jobs:
  build:
    runs-on: ubuntu-slim   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Test
        run: echo "test"




