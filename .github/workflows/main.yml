name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Test
        run: echo "test"

  deploy:
    needs: test
    runs-on: ubuntu-slim
    steps:

      - name: Deployment
        run: echo "app is deployed to container"



