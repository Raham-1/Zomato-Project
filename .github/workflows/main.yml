name: Manual Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - development
          - staging
          - production
      deploy_tests:
        description: 'Run integration tests?'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-slim   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Test
        run: echo "test"

  deploy:
    if: ${{ github.event.inputs.environment == 'production' }}
    needs: test
    runs-on: ubuntu-slim
    steps:

      - name: Deployment
        run: echo "app is deployed to container"



