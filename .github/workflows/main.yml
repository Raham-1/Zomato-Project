name: Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: staging
      deploy_tests:
        required: false
        type: boolean
        default: true
      node-version:
        required: false
        type: string
        default: '20'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      deploy_tests:
        description: 'Run integration tests?'
        required: false
        type: boolean
        default: true
      node-version:
        description: 'Node version'
        required: false
        default: '20'
        type: string

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    needs: build
    if: ${{ inputs.deploy_tests == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "test"
